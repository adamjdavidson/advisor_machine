[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "advisor-machine"
version = "0.1.0"
description = "Advisor Machine council command scaffold"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
council = "advisor_machine.council:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
advisor_machine = ["personas/*.md"]
